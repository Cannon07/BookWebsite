name: Step 3.5 - GitHub Actions Credential Test

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: 'basic'
        type: choice
        options:
        - basic
        - detailed
        - credential_only

jobs:
  credential-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Basic Credential Test
        if: github.event.inputs.test_type == 'basic' || github.event.inputs.test_type == 'detailed'
        run: |
          echo "🧪 STEP 3.5: GitHub Actions Credential Test"
          echo "============================================"
          
          echo "🔍 Environment Check:"
          echo "  GITHUB_ACTIONS: $GITHUB_ACTIONS"
          echo "  Runner OS: $RUNNER_OS"
          echo "  Git version: $(git --version)"
          
          echo ""
          echo "🔑 Credential Check:"
          echo "  Username length: ${#OVERLEAF_GIT_USERNAME}"
          echo "  Token length: ${#OVERLEAF_GIT_TOKEN}"
          echo "  Project ID length: ${#OVERLEAF_PROJECT_ID}"
          echo "  Username starts with: ${OVERLEAF_GIT_USERNAME:0:4}***"
          echo "  Token starts with: ${OVERLEAF_GIT_TOKEN:0:8}***"
        env:
          OVERLEAF_GIT_USERNAME: ${{ secrets.OVERLEAF_GIT_USERNAME }}
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
      
      - name: Network and Git Access Test
        if: github.event.inputs.test_type == 'basic' || github.event.inputs.test_type == 'detailed'
        run: |
          echo ""
          echo "🌐 Network Tests:"
          
          # Test 1: Can we reach git.overleaf.com?
          echo "  Testing DNS resolution..."
          if nslookup git.overleaf.com > /dev/null 2>&1; then
            echo "  ✅ DNS resolution works"
          else
            echo "  ❌ DNS resolution failed"
          fi
          
          # Test 2: Can we connect to git.overleaf.com?
          echo "  Testing HTTPS connection..."
          if curl -s --connect-timeout 10 https://git.overleaf.com > /dev/null 2>&1; then
            echo "  ✅ HTTPS connection works"
          else
            echo "  ❌ HTTPS connection failed"
          fi
          
          # Test 3: Basic git ls-remote (should fail with auth error)
          echo "  Testing basic git access..."
          if timeout 30 git ls-remote https://git.overleaf.com/$OVERLEAF_PROJECT_ID 2>&1 | head -5; then
            echo "  ✅ Git access works (unexpected!)"
          else
            echo "  ❌ Git access failed (expected without auth)"
          fi
        env:
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
      
      - name: Credential Methods Test
        if: github.event.inputs.test_type == 'detailed'
        run: |
          echo ""
          echo "🔧 Credential Methods Test:"
          
          # Method 1: Credential helper
          echo "  Method 1: Git credential helper"
          git config --global credential.helper store
          echo "https://$OVERLEAF_GIT_USERNAME:$OVERLEAF_GIT_TOKEN@git.overleaf.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          
          echo "    Credential file created: $(ls -la ~/.git-credentials)"
          if timeout 30 git ls-remote https://git.overleaf.com/$OVERLEAF_PROJECT_ID 2>&1; then
            echo "    ✅ Method 1 SUCCESS"
          else
            echo "    ❌ Method 1 FAILED"
          fi
          
          # Method 2: Direct URL embedding
          echo "  Method 2: Direct URL embedding"
          DIRECT_URL="https://$OVERLEAF_GIT_USERNAME:$OVERLEAF_GIT_TOKEN@git.overleaf.com/$OVERLEAF_PROJECT_ID"
          if timeout 30 git ls-remote "$DIRECT_URL" 2>&1; then
            echo "    ✅ Method 2 SUCCESS"
          else
            echo "    ❌ Method 2 FAILED"
          fi
          
          # Method 3: URL encoding
          echo "  Method 3: URL encoded credentials"
          ENCODED_USERNAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$OVERLEAF_GIT_USERNAME', safe=''))")
          ENCODED_TOKEN=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$OVERLEAF_GIT_TOKEN', safe=''))")
          ENCODED_URL="https://$ENCODED_USERNAME:$ENCODED_TOKEN@git.overleaf.com/$OVERLEAF_PROJECT_ID"
          if timeout 30 git ls-remote "$ENCODED_URL" 2>&1; then
            echo "    ✅ Method 3 SUCCESS"
          else
            echo "    ❌ Method 3 FAILED"
          fi
        env:
          OVERLEAF_GIT_USERNAME: ${{ secrets.OVERLEAF_GIT_USERNAME }}
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
      
      - name: Advanced Diagnostic Test
        if: github.event.inputs.test_type == 'credential_only'
        run: |
          echo ""
          echo "🔬 ADVANCED DIAGNOSTIC TEST"
          echo "=========================="
          
          # Test the exact same approach that works locally
          echo "Testing exact local method replication..."
          
          # Create credential file exactly like local version
          mkdir -p scripts/overleaf-monitor/data
          echo "https://$OVERLEAF_GIT_USERNAME:$OVERLEAF_GIT_TOKEN@git.overleaf.com" > scripts/overleaf-monitor/data/.git-credentials
          chmod 600 scripts/overleaf-monitor/data/.git-credentials
          
          # Set git config exactly like local
          git config --global credential.helper "store --file=$(pwd)/scripts/overleaf-monitor/data/.git-credentials"
          
          echo "  Testing with local-style credential setup..."
          if timeout 30 git ls-remote https://git.overleaf.com/$OVERLEAF_PROJECT_ID 2>&1; then
            echo "  ✅ Local method replication SUCCESS"
          else
            echo "  ❌ Local method replication FAILED"
          fi
          
          # Test different project ID formats
          echo ""
          echo "🔍 Project ID Analysis:"
          echo "  Full Project ID: $OVERLEAF_PROJECT_ID"
          echo "  Project ID length: ${#OVERLEAF_PROJECT_ID}"
          echo "  Starts with: ${OVERLEAF_PROJECT_ID:0:8}***"
          
          # Test if it's a Git URL format issue
          echo ""
          echo "🧪 Testing different URL formats..."
          
          # Format 1: Standard
          echo "  Format 1: Standard git.overleaf.com/PROJECT_ID"
          TEST_URL1="https://git.overleaf.com/$OVERLEAF_PROJECT_ID"
          if timeout 10 curl -s -I -u "$OVERLEAF_GIT_USERNAME:$OVERLEAF_GIT_TOKEN" "$TEST_URL1/info/refs?service=git-upload-pack" | head -1; then
            echo "    Response received"
          else
            echo "    No response"
          fi
          
          # Format 2: With .git suffix
          echo "  Format 2: With .git suffix"
          TEST_URL2="https://git.overleaf.com/$OVERLEAF_PROJECT_ID.git"
          if timeout 10 curl -s -I -u "$OVERLEAF_GIT_USERNAME:$OVERLEAF_GIT_TOKEN" "$TEST_URL2/info/refs?service=git-upload-pack" | head -1; then
            echo "    Response received"
          else
            echo "    No response"
          fi
          
          # Test character encoding issues
          echo ""
          echo "🔤 Character Encoding Test:"
          echo "  Username bytes: $(echo -n "$OVERLEAF_GIT_USERNAME" | wc -c)"
          echo "  Token bytes: $(echo -n "$OVERLEAF_GIT_TOKEN" | wc -c)"
          echo "  Username contains @: $(echo "$OVERLEAF_GIT_USERNAME" | grep -q '@' && echo 'YES' || echo 'NO')"
          echo "  Username hex dump (first 20 chars): $(echo -n "${OVERLEAF_GIT_USERNAME:0:20}" | xxd -p)"
          
          # Test if there are hidden characters
          if [ ${#OVERLEAF_GIT_USERNAME} -ne $(echo -n "$OVERLEAF_GIT_USERNAME" | wc -c) ]; then
            echo "  ⚠️  Username contains hidden characters!"
          fi
          if [ ${#OVERLEAF_GIT_TOKEN} -ne $(echo -n "$OVERLEAF_GIT_TOKEN" | wc -c) ]; then
            echo "  ⚠️  Token contains hidden characters!"
          fi
          
          # Final test: Exact replication of working local command
          echo ""
          echo "🎯 EXACT LOCAL REPLICATION TEST:"
          echo "Using the exact git ls-remote command that works locally..."
          
          # This should be the exact command that works in your local environment
          git config --list | grep credential
          
          if timeout 30 git ls-remote --heads https://git.overleaf.com/$OVERLEAF_PROJECT_ID 2>&1; then
            echo "✅ EXACT LOCAL REPLICATION WORKS!"
          else
            echo "❌ Even exact replication fails"
          fi
        env:
          OVERLEAF_GIT_USERNAME: ${{ secrets.OVERLEAF_GIT_USERNAME }}
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}