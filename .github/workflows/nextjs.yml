name: Deploy Next.js site to Pages with Overleaf Integration

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      process_all_chapters:
        description: 'Process all chapters (will overwrite existing ones)'
        type: boolean
        default: false
        required: false
      force_overleaf_sync:
        description: 'Force Overleaf sync even if no changes detected'
        type: boolean
        default: false
        required: false

  # Schedule automatic Overleaf checks (runs every 6 hours)
  schedule:
    - cron: '0 */6 * * *'

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Overleaf Pipeline Job - handles sync, change detection, and chapter processing
  overleaf-pipeline:
    runs-on: ubuntu-latest
    outputs:
      changes_detected: ${{ steps.pipeline.outputs.changes_detected }}
      pipeline_success: ${{ steps.pipeline.outputs.pipeline_success }}
      conversion_success: ${{ steps.pipeline.outputs.conversion_success }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc git
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Install Node dependencies
        run: |
          npm ci
          npm install -g ts-node
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Overleaf Sync"
      
      - name: Run Overleaf Pipeline
        id: pipeline
        run: |
          echo "🚀 Starting Overleaf Pipeline..."
          
          # Run the pipeline (Python script handles GITHUB_OUTPUT directly)
          python3 scripts/overleaf-monitor/pipeline.py
          
          # FIXED: Just display the results - no redundant parsing
          if [ -f "pipeline_results.json" ]; then
            echo "📊 Pipeline results found"
            cat pipeline_results.json
            echo "✅ Pipeline outputs set by Python script"
          else
            echo "❌ Pipeline results file not found - setting default outputs"
            echo "changes_detected=false" >> $GITHUB_OUTPUT
            echo "pipeline_success=false" >> $GITHUB_OUTPUT
            echo "conversion_success=false" >> $GITHUB_OUTPUT
          fi
        env:
          OVERLEAF_GIT_USERNAME: ${{ secrets.OVERLEAF_GIT_USERNAME }}
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
      
      - name: Debug Pipeline Outputs
        run: |
          echo "🔍 Debugging pipeline outputs..."
          echo "Raw step outputs:"
          echo "  changes_detected: '${{ steps.pipeline.outputs.changes_detected }}'"
          echo "  pipeline_success: '${{ steps.pipeline.outputs.pipeline_success }}'"
          echo "  conversion_success: '${{ steps.pipeline.outputs.conversion_success }}'"
          
          echo "Condition testing:"
          if [[ "${{ steps.pipeline.outputs.changes_detected }}" == "true" ]]; then
            echo "  ✅ changes_detected == 'true' - COMMIT WILL RUN"
          else
            echo "  ❌ changes_detected != 'true' - COMMIT WILL BE SKIPPED"
            echo "  Actual value: '${{ steps.pipeline.outputs.changes_detected }}'"
          fi

      - name: Commit and push changes
        if: steps.pipeline.outputs.changes_detected == 'true'
        run: |
          echo "📝 Committing Overleaf changes..."
          echo "🔍 Debug: Checking what changes exist..."

          echo "Git status:"
          git status

          echo "Files in chapters/:"
          ls -la chapters/ | head -10

          echo "Files in app/:"
          ls -la app/ | head -10 2>/dev/null || echo "app/ directory not found"

          git add chapters/
          git add app/
          git add pipeline_results.json

          echo "Git status after add:"
          git status

          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
          else
            git commit -m "📚 Auto-update from Overleaf: $(date '+%Y-%m-%d %H:%M:%S UTC')"
            git push
            echo "✅ Changes committed and pushed"
          fi
      
      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overleaf-pipeline-logs
          path: scripts/overleaf-monitor/data/pipeline.log
          retention-days: 30

  # Git changes check (supplements Overleaf changes)
  changes:
    runs-on: ubuntu-latest
    needs: overleaf-pipeline
    outputs:
      git_chapters_changed: ${{ steps.filter.outputs.git_chapters_changed }}
      should_build: ${{ steps.determine.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for git changes in chapters directory
        id: filter
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "git_chapters_changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Scheduled run - skipping git change detection"
          elif [ -n "${{ github.event.before }}" ] && [ -n "${{ github.event.after }}" ]; then
            if git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -q "^chapters/"; then
              echo "git_chapters_changed=true" >> $GITHUB_OUTPUT
              echo "📝 Git changes detected in chapters directory"
            else
              echo "git_chapters_changed=false" >> $GITHUB_OUTPUT
              echo "ℹ️  No git changes in chapters directory"
            fi
          else
            echo "git_chapters_changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️  Unable to determine git changes"
          fi
      
      - name: Determine if build should run
        id: determine
        run: |
          overleaf_changes="${{ needs.overleaf-pipeline.outputs.changes_detected }}"
          git_changes="${{ steps.filter.outputs.git_chapters_changed }}"
          manual_trigger="${{ github.event_name == 'workflow_dispatch' }}"
          process_all="${{ github.event.inputs.process_all_chapters }}"
          
          echo "🔍 Build decision factors:"
          echo "  Overleaf changes: '$overleaf_changes'"
          echo "  Git changes: '$git_changes'"
          echo "  Manual trigger: '$manual_trigger'"
          echo "  Process all chapters: '$process_all'"
          
          if [ "$overleaf_changes" = "true" ] || [ "$git_changes" = "true" ] || [ "$manual_trigger" = "true" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "✅ Build should run"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "⏭️  Build will be skipped"
          fi

  # Pre-build job (only for manual override processing)
  pre-build:
    runs-on: ubuntu-latest
    needs: [overleaf-pipeline, changes]
    # Only run for manual triggers with process_all_chapters option
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.process_all_chapters == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Install Node dependencies
        run: |
          npm ci
          npm install -g ts-node
      
      - name: Force process all chapters
        run: |
          echo "🔄 Force processing all chapters..."
          ts-node scripts/process-chapter.ts --all chapters
      
      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Force Process All"
          git add .
          git commit -m "🔄 Force update all chapters from manual trigger" || echo "No changes to commit"
          git push || echo "No changes to push"

  # Build job
  build:
    runs-on: ubuntu-latest
    needs: [overleaf-pipeline, changes, pre-build]
    if: |
      always() && 
      needs.changes.outputs.should_build == 'true' &&
      ((needs.pre-build.result == 'success') || (needs.pre-build.result == 'skipped'))
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # Get latest changes after potential commits
          fetch-depth: 0
      
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next
      
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-
      
      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      
      - name: Build with Next.js
        run: ${{ steps.detect-package-manager.outputs.runner }} next build
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.result == 'success'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4