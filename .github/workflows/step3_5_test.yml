name: Step 3.5 - GitHub Actions Credential Test

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Test type to run'
        required: true
        default: 'basic'
        type: choice
        options:
        - basic
        - detailed
        - credential_only

jobs:
  credential-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Basic Credential Test
        if: github.event.inputs.test_type == 'basic' || github.event.inputs.test_type == 'detailed'
        run: |
          echo "🧪 STEP 3.5: GitHub Actions Credential Test"
          echo "============================================"
          
          echo "🔍 Environment Check:"
          echo "  GITHUB_ACTIONS: $GITHUB_ACTIONS"
          echo "  Runner OS: $RUNNER_OS"
          echo "  Git version: $(git --version)"
          
          echo ""
          echo "🔑 Credential Check:"
          echo "  Username length: ${#OVERLEAF_GIT_USERNAME}"
          echo "  Token length: ${#OVERLEAF_GIT_TOKEN}"
          echo "  Project ID length: ${#OVERLEAF_PROJECT_ID}"
          echo "  Username starts with: ${OVERLEAF_GIT_USERNAME:0:4}***"
          echo "  Token starts with: ${OVERLEAF_GIT_TOKEN:0:8}***"
        env:
          OVERLEAF_GIT_USERNAME: ${{ secrets.OVERLEAF_GIT_USERNAME }}
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
      
      - name: Network and Git Access Test
        if: github.event.inputs.test_type == 'basic' || github.event.inputs.test_type == 'detailed'
        run: |
          echo ""
          echo "🌐 Network Tests:"
          
          # Test 1: Can we reach git.overleaf.com?
          echo "  Testing DNS resolution..."
          if nslookup git.overleaf.com > /dev/null 2>&1; then
            echo "  ✅ DNS resolution works"
          else
            echo "  ❌ DNS resolution failed"
          fi
          
          # Test 2: Can we connect to git.overleaf.com?
          echo "  Testing HTTPS connection..."
          if curl -s --connect-timeout 10 https://git.overleaf.com > /dev/null 2>&1; then
            echo "  ✅ HTTPS connection works"
          else
            echo "  ❌ HTTPS connection failed"
          fi
          
          # Test 3: Basic git ls-remote (should fail with auth error)
          echo "  Testing basic git access..."
          if timeout 30 git ls-remote https://git.overleaf.com/$OVERLEAF_PROJECT_ID 2>&1 | head -5; then
            echo "  ✅ Git access works (unexpected!)"
          else
            echo "  ❌ Git access failed (expected without auth)"
          fi
        env:
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
      
      - name: Credential Methods Test
        if: github.event.inputs.test_type == 'detailed'
        run: |
          echo ""
          echo "🔧 Credential Methods Test:"
          
          # Method 1: Credential helper
          echo "  Method 1: Git credential helper"
          git config --global credential.helper store
          echo "https://$OVERLEAF_GIT_USERNAME:$OVERLEAF_GIT_TOKEN@git.overleaf.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials
          
          echo "    Credential file created: $(ls -la ~/.git-credentials)"
          if timeout 30 git ls-remote https://git.overleaf.com/$OVERLEAF_PROJECT_ID 2>&1; then
            echo "    ✅ Method 1 SUCCESS"
          else
            echo "    ❌ Method 1 FAILED"
          fi
          
          # Method 2: Direct URL embedding
          echo "  Method 2: Direct URL embedding"
          DIRECT_URL="https://$OVERLEAF_GIT_USERNAME:$OVERLEAF_GIT_TOKEN@git.overleaf.com/$OVERLEAF_PROJECT_ID"
          if timeout 30 git ls-remote "$DIRECT_URL" 2>&1; then
            echo "    ✅ Method 2 SUCCESS"
          else
            echo "    ❌ Method 2 FAILED"
          fi
          
          # Method 3: URL encoding
          echo "  Method 3: URL encoded credentials"
          ENCODED_USERNAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$OVERLEAF_GIT_USERNAME', safe=''))")
          ENCODED_TOKEN=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$OVERLEAF_GIT_TOKEN', safe=''))")
          ENCODED_URL="https://$ENCODED_USERNAME:$ENCODED_TOKEN@git.overleaf.com/$OVERLEAF_PROJECT_ID"
          if timeout 30 git ls-remote "$ENCODED_URL" 2>&1; then
            echo "    ✅ Method 3 SUCCESS"
          else
            echo "    ❌ Method 3 FAILED"
          fi
        env:
          OVERLEAF_GIT_USERNAME: ${{ secrets.OVERLEAF_GIT_USERNAME }}
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
      
      - name: Secret Verification Test
        if: github.event.inputs.test_type == 'credential_only'
        run: |
          echo "🔍 SECRET VERIFICATION TEST"
          echo "=========================="
          
          echo "Checking if secrets have been updated..."
          echo "  Username: ${OVERLEAF_GIT_USERNAME:0:4}***${OVERLEAF_GIT_USERNAME: -3}"
          echo "  Token: ${OVERLEAF_GIT_TOKEN:0:8}***${OVERLEAF_GIT_TOKEN: -3}"
          echo "  Project ID: ${OVERLEAF_PROJECT_ID:0:8}***${OVERLEAF_PROJECT_ID: -3}"
          
          echo ""
          echo "Token characteristics:"
          echo "  Token length: ${#OVERLEAF_GIT_TOKEN}"
          echo "  Token starts with: ${OVERLEAF_GIT_TOKEN:0:12}"
          echo "  Token format: $(echo $OVERLEAF_GIT_TOKEN | grep -o '^olp_[a-zA-Z0-9]*' | head -c 12)***"
          
          # Check if this is the OLD token format
          if [[ "$OVERLEAF_GIT_TOKEN" == *"olp_1Wn3"* ]]; then
            echo "  ⚠️  This appears to be the OLD token!"
            echo "  ⚠️  GitHub Actions may not have picked up the new secret yet"
          else
            echo "  ✅ This appears to be a NEW token"
          fi
          
          echo ""
          echo "🕐 Secret update timing check:"
          echo "  Current time: $(date -u)"
          echo "  Workflow run: $GITHUB_RUN_NUMBER"
          echo "  Run ID: $GITHUB_RUN_ID"
        env:
          OVERLEAF_GIT_USERNAME: ${{ secrets.OVERLEAF_GIT_USERNAME }}
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}
        if: github.event.inputs.test_type == 'credential_only'
        run: |
          echo ""
          echo "🚀 PIPELINE METHOD VERIFICATION"
          echo "==============================="
          echo "Testing the exact method our pipeline will use..."
          
          # Test Method 3 with actual git clone (what our pipeline does)
          echo "📥 Testing Method 3: URL encoded git clone"
          
          # Set up URL encoding exactly like our pipeline
          ENCODED_USERNAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$OVERLEAF_GIT_USERNAME', safe=''))")
          ENCODED_TOKEN=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$OVERLEAF_GIT_TOKEN', safe=''))")
          AUTH_URL="https://$ENCODED_USERNAME:$ENCODED_TOKEN@git.overleaf.com/$OVERLEAF_PROJECT_ID"
          
          echo "  Encoded username: ${ENCODED_USERNAME:0:4}***"
          echo "  Encoded token: ${ENCODED_TOKEN:0:8}***"
          echo "  Testing shallow clone..."
          
          # Test shallow clone (what pipeline does first)
          if timeout 60 git clone --depth 1 "$AUTH_URL" test-repo-shallow 2>&1; then
            echo "  ✅ SHALLOW CLONE SUCCESS!"
            echo "  📊 Repository info:"
            echo "    Files: $(find test-repo-shallow -name "*.tex" | wc -l) .tex files found"
            echo "    Size: $(du -sh test-repo-shallow | cut -f1)"
            rm -rf test-repo-shallow
            SHALLOW_SUCCESS=true
          else
            echo "  ❌ Shallow clone failed"
            SHALLOW_SUCCESS=false
          fi
          
          echo ""
          echo "  Testing full clone..."
          
          # Test full clone (pipeline fallback)
          if timeout 120 git clone "$AUTH_URL" test-repo-full 2>&1; then
            echo "  ✅ FULL CLONE SUCCESS!"
            echo "  📊 Repository info:"
            echo "    Files: $(find test-repo-full -name "*.tex" | wc -l) .tex files found"
            echo "    Size: $(du -sh test-repo-full | cut -f1)"
            echo "    Commits: $(cd test-repo-full && git log --oneline | wc -l)"
            rm -rf test-repo-full
            FULL_SUCCESS=true
          else
            echo "  ❌ Full clone failed"
            FULL_SUCCESS=false
          fi
          
          echo ""
          echo "🎯 PIPELINE READINESS ASSESSMENT:"
          if [ "$SHALLOW_SUCCESS" = true ] || [ "$FULL_SUCCESS" = true ]; then
            echo "✅ PIPELINE WILL WORK!"
            if [ "$SHALLOW_SUCCESS" = true ]; then
              echo "   Shallow clone works - optimal performance"
            else
              echo "   Full clone works - will use as fallback"
            fi
          else
            echo "❌ PIPELINE WILL FAIL"
            echo "   Both shallow and full clone failed"
            echo "   Need to resolve credential/permission issues"
          fi
          
          # Test git pull simulation (for future runs)
          echo ""
          echo "📥 Testing git pull simulation..."
          
          # Clone first, then test pull
          if timeout 60 git clone --depth 1 "$AUTH_URL" test-pull-repo >/dev/null 2>&1; then
            cd test-pull-repo
            
            # Remove embedded credentials from remote (security)
            git remote set-url origin "https://git.overleaf.com/$OVERLEAF_PROJECT_ID"
            
            # Set remote back to auth URL temporarily for pull test
            git remote set-url origin "$AUTH_URL"
            
            if timeout 60 git pull origin master 2>&1; then
              echo "  ✅ Git pull works!"
            else
              echo "  ❌ Git pull failed"
            fi
            
            cd ..
            rm -rf test-pull-repo
          else
            echo "  ⏭️  Skipping pull test (clone failed)"
          fi
          
          echo ""
          echo "🔐 Security Test:"
          echo "Testing credential cleanup..."
          
          # Test that we can successfully remove credentials from git config
          if timeout 30 git clone --depth 1 "$AUTH_URL" test-security-repo >/dev/null 2>&1; then
            cd test-security-repo
            
            # This is what our pipeline does for security
            git remote set-url origin "https://git.overleaf.com/$OVERLEAF_PROJECT_ID"
            
            # Verify credentials are removed
            REMOTE_URL=$(git remote get-url origin)
            if echo "$REMOTE_URL" | grep -q "@"; then
              echo "  ⚠️  Credentials still in remote URL!"
            else
              echo "  ✅ Credentials successfully removed from git config"
            fi
            
            cd ..
            rm -rf test-security-repo
          else
            echo "  ⏭️  Skipping security test (clone failed)"
          fi
        env:
          OVERLEAF_GIT_USERNAME: ${{ secrets.OVERLEAF_GIT_USERNAME }}
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          OVERLEAF_PROJECT_ID: ${{ secrets.OVERLEAF_PROJECT_ID }}